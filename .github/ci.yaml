# The full gate runs on the default shell, the current stable Zig. The
# compatibility lane has to compile and pass the suite on the previous one.
# The cold lane keeps `just check-cold` wired: a lazy dependency unwrapped in
# developer-only code only panics when `zig-pkg` is empty, which CI is anyway.
jobs:
  - recipe: ci
  - recipe: check
    shell: zig-old
  - recipe: check-cold
