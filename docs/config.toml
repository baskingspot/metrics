# The metrics guide, served at baskingspot.dev/metrics/. The theme and the
# site build come from baskingspot-docs; the router in baskingspot/site serves
# /metrics/...
base_url = "https://baskingspot.dev/metrics"
theme = "baskingspot"
title = "metrics"
description = "Prometheus text exposition format for Zig: write metrics to any writer, no HTTP."

generate_feeds = false
build_search_index = false

[markdown]
insert_anchor_links = "heading"

[markdown.highlighting]
# An unknown fence language is a build error, not an unhighlighted block.
error_on_missing_language = true
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
repo = "baskingspot/metrics"
api = true
third_party = false
